# Rendered at container start by the nginx image's envsubst entrypoint, which
# processes /etc/nginx/templates/*.template. ${NGINX_PORT} therefore comes from
# the environment (default 3014, set in the Dockerfile) rather than being fixed
# here — that is what lets the production and test stacks share one file
# instead of drifting apart on two hardcoded ports.
#
# Only ${...} placeholders are substituted, so nginx's own $uri is untouched.
server {
    listen ${NGINX_PORT};

    root /usr/share/nginx/html;

    index index.html;

    # The JS bundle is ~2 MB uncompressed (~0.6 MB gzipped).
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri /index.html;
    }

    # Vite puts a content hash in every /assets/ file name, so a file never
    # changes in place and the browser can keep it. index.html is not cached
    # this way, so a new deploy is still picked up on the next load.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html names the current hashed chunks, so the browser must check
    # for a new one on every load; a cached copy would ask for chunks that a
    # newer deploy has removed. try_files above also lands here.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        autoindex off;
    }

    error_page 404 /index.html;
}
