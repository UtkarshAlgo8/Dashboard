# Rendered at container start by the nginx image's envsubst entrypoint, which
# processes /etc/nginx/templates/*.template. ${NGINX_PORT} therefore comes from
# the environment (default 3014, set in the Dockerfile) rather than being fixed
# here — that is what lets the production and test stacks share one file
# instead of drifting apart on two hardcoded ports.
#
# Only ${...} placeholders are substituted, so nginx's own $uri is untouched.
server {
    listen ${NGINX_PORT};

    root /usr/share/nginx/html;

    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /static/ {
        autoindex off;
    }

    error_page 404 /index.html;
}
